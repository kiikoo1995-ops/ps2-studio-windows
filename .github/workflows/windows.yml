name: Windows tests and portable EXE
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests (app and website)
        run: python -m unittest discover -s tests -v
      - name: Install PyInstaller
        if: github.event_name != 'pull_request'
        run: python -m pip install pyinstaller
      - name: Build Windows EXE
        if: github.event_name != 'pull_request'
        run: python -m PyInstaller --noconfirm --onefile --windowed --name PS2Studio app.py
      - name: Package ZIP
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: Compress-Archive -Path dist/PS2Studio.exe -DestinationPath dist/PS2Studio-Windows.zip -Force
      - name: Upload ZIP artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: PS2Studio-Windows
          path: dist/PS2Studio-Windows.zip
          if-no-files-found: error
      - name: Publish or replace preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          gh release view preview --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload preview dist/PS2Studio-Windows.zip --clobber --repo $repo
          } else {
            gh release create preview dist/PS2Studio-Windows.zip --target $env:GITHUB_SHA --title 'PS2 Studio - Preview' --notes 'Versión preliminar de Windows. Requiere instalar PCSX2 por separado; no incluye BIOS ni juegos.' --prerelease --latest=false --repo $repo
          }
