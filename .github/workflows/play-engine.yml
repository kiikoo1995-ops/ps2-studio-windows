          python -m PyInstaller --noconfirm --onefile --windowed --name PS2Studio app.py
          if ($LASTEXITCODE -ne 0) { throw 'Application build failed' }
          Copy-Item engine dist/engine -Recurse
          Compress-Archive -Path dist/PS2Studio.exe,dist/engine -DestinationPath PS2Studio-Play-internal.zip
          Get-FileHash PS2Studio-Play-internal.zip -Algorithm SHA256
