name: Experimental standalone PS2 Studio
on:
  pull_request:
    paths:
      - '.github/workflows/play-package.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: standalone-play-package
  cancel-in-progress: true
jobs:
  package:
    if: github.repository == 'kiikoo1995-ops/ps2-studio-windows'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Retrieve existing internal motor artifact
        uses: actions/download-artifact@v4
        with:
          name: Play-engine-internal-test
          run-id: '45296267226'
          github-token: ${{ github.token }}
          path: engine/play
      - name: Stage and verify unified app-local Mesa desktop OpenGL
        timeout-minutes: 3
        shell: pwsh
        run: |
          $dir = (Resolve-Path engine/play).Path
          $exe = Join-Path $dir 'Play.exe'
          $mesa = Join-Path $dir 'opengl32sw.dll'
          $local = Join-Path $dir 'opengl32.dll'
          if (!(Test-Path $mesa) -or (Test-Path $local)) { throw 'Unexpected Mesa library layout' }
          Copy-Item $mesa $local
          $env:QT_OPENGL = 'desktop'
          Get-FileHash $local -Algorithm SHA256
          'QT_OPENGL=desktop' | Out-File -FilePath $env:GITHUB_ENV -Append
          $proc = $null
          try {
            $proc = Start-Process -FilePath $exe -WorkingDirectory $dir -PassThru
            Start-Sleep -Seconds 12
            $proc.Refresh()
            if ($proc.HasExited) { throw "Unified Mesa startup failed: $($proc.ExitCode)" }
            $modules = @($proc.Modules | Where-Object { $_.ModuleName -match 'opengl|libEGL|libGLES' })
            $modules | Select-Object ModuleName,FileName | Format-Table | Out-String | Write-Host
            if (!($modules | Where-Object { $_.FileName -eq $local })) { throw 'Local Mesa was not actually loaded' }
            if ($proc.MainWindowHandle -eq 0 -or !$proc.Responding) { throw 'Play window absent or unresponsive' }
            Write-Host 'APP_LOCAL_MESA_STARTUP_PASS: responsive Play window and local OpenGL implementation verified'
          } finally {
            if ($proc -and !$proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Separate native OpenGL and verified Mesa fallback
        shell: pwsh
        run: |
          $native = (Resolve-Path engine/play).Path
          $fallback = Join-Path (Split-Path $native) 'play-mesa'
          if (Test-Path $fallback) { throw 'Unexpected fallback directory' }
          Copy-Item $native $fallback -Recurse
          Remove-Item (Join-Path $native 'opengl32.dll') -ErrorAction Stop
          if (!(Test-Path (Join-Path $native 'Play.exe')) -or
              (Test-Path (Join-Path $native 'opengl32.dll')) -or
              !(Test-Path (Join-Path $fallback 'Play.exe')) -or
              !(Test-Path (Join-Path $fallback 'opengl32.dll'))) { throw 'Invalid graphics package layout' }
          Write-Host 'NATIVE_AND_MESA_LAYOUT_PASS (native GPU execution not verified on hosted runner)'
      - name: Build PS2 Studio
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --onefile --windowed --name PS2Studio app.py
      - name: Assemble internal test package
        shell: pwsh
        run: |
          Copy-Item engine dist/engine -Recurse
          Compress-Archive -Path dist/PS2Studio.exe,dist/engine -DestinationPath PS2Studio-Play-internal.zip
          $hash = (Get-FileHash PS2Studio-Play-internal.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PS2Studio-Play-internal.zip" | Set-Content PS2Studio-Play-internal.zip.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: PS2Studio-Play-internal
          path: |
            PS2Studio-Play-internal.zip
            PS2Studio-Play-internal.zip.sha256
          retention-days: 3
          if-no-files-found: error
