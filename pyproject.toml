[project]
name = "ps2-studio"
version = "0.2.0"
description = "Offline Windows game-library launcher for PCSX2"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "PS2 Studio contributors"}]

[project.urls]
"PCSX2" = "https://pcsx2.net/"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ps2studio*"]
